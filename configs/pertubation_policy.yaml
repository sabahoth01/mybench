perturbation_policies:

  none:
    description: "No perturbation; baseline evaluation."
    mode: "off"
    rules: []

  probabilistic:
    description: "Inject random perturbations with defined probabilities."
    mode: "probabilistic"
    rules:
      tool_unavailability: 0.10
      input_noise: 0.15
      constraint_shift: 0.05
      step_shuffle: 0.03

  progressive:
    description: "Increase difficulty gradually every N trials."
    mode: "progressive"
    step_interval: 3
    actions:
      - increase_constraint_density
      - add_distractor_tool

  performance_based:
    description: "Perturbation strength adjusts to agent success."
    mode: "adaptive"
    thresholds:
      high_success: 0.8
      low_success: 0.3
    high_success_actions:
      - increase_difficulty
      - add_constraint
    low_success_actions:
      - simplify_inputs
      - reduce_constraint_density
